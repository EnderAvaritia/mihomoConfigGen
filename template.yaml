mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/yacd/archive/gh-pages.zip"

find-process-mode: always

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

tun:
  enable: false
  stack: system
  device: meta
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  respect-rules: true
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
    - localhost.ptlogin2.qq.com

  direct-nameserver:
  # 用于 direct 出口域名解析的 DNS 服务器
    - 223.5.5.5 
    - 180.76.76.76 
    - 119.29.29.29 
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query

    
  default-nameserver:
  # 默认 DNS, 用于解析 DNS 服务器 的域名
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query

  proxy-server-nameserver:
  # 代理节点域名解析服务器，仅用于解析代理节点的域名
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

    
  nameserver-policy:
  # 指定域名查询的解析服务器，可使用 geosite
    "rule-set:cn_domain,private_domain":
        - https://120.53.53.53/dns-query
        - https://223.5.5.5/dns-query
      

  nameserver:
    - 223.5.5.5 # 阿里DNS
    - 180.76.76.76 # 百度DNS
    - 119.29.29.29 # 腾讯DNS
    #- 117.50.11.11 # ONE DNS拦截版 恶意网站拦截、广告过滤
    #- 117.50.10.10 # ONE DNS纯净版 直接返回其真实的响应结果
    #- 114.114.114.114 # 114DNS
    
    - 101.101.101.101
    - 101.102.103.104
    
    - 8.8.8.8 # 谷歌DNS
    - 1.1.1.1 # Cloudflare DNS
    
    - 2001:de4::101
    - 2001:de4::102
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
    - 2606:4700:4700::1111
    - 2606:4700:4700::1001
    
    - 2001:b000:168::1
    - 2001:b000:168::2
    # HiNet 中华电信 DNS
    
    - "[2402:4e00::]"
    - "[2402:4e00:1::]"
    # 腾讯 DNS 
    - 2400:3200::1
    - 2400:3200:baba::1
    # 阿里 DNS
    
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
    
  fallback:
    - tls://dns.rubyfish.cn:853
    - tls://1.0.0.1:853
    - tls://dns.google:853
    - https://dns.rubyfish.cn/dns-query
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
 #fallback-filter:
    #geoip: true # 默认
    #ipcidr: # 在这个网段内的 IP 地址会被考虑为被污染的 IP
      #- 240.0.0.0/4

#这里是订阅更新和延迟测试相关
#可以更改 proxy 指定的出站
p: &p 
    type: http
    interval: 86400
    proxy: 🗺️ 订阅更新
    header: 
        User-Agent:
          - "clash-verge/v2.2.8"
#          - "Clash/v1.18.0"
#          - "mihomo/1.18.3"
    health-check:
        enable: true
        url: http://www.gstatic.com/generate_204
        interval: 18000
        timeout: 2000
        lazy: true
        # expected-status: 204
    exclude-filter: "剩余|链接|连接|域名|官网|网站|到期|过期|重置|邮箱"

# url 里填写自己的订阅,名称不能重复,名字可以自己改
proxy-providers:
  custom_name1:
    <<: *p
    url: ""

  custom_name2:
    <<: *p
    url: ""

##########################################################################################################

proxies:
  - name: "DNS"
    type: dns
####应急使用的代理
  - name: "TEMP"
    type: socks5
    server: 127.0.0.1
    port: 1080

proxy-groups:

  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择,🚀 手动切换,⚖️ 负载均衡,DIRECT,REJECT,🇭🇰 香港,🇹🇼 台湾,🇯🇵 日本,🇺🇲 美国,🇸🇬 新加坡]

